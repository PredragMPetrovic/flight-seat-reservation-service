spring.application.name=flight-seat-reservation-service

spring.datasource.url=jdbc:h2:mem:flightdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

booking.cutoff-minutes=45
booking.hold-minutes=15
booking.sweep-interval-ms=60000
